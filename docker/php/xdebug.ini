[xdebug]
; Modo debug: permite breakpoints y depuración paso a paso
xdebug.mode = debug

; Se conecta automáticamente al IDE en cada petición (sin necesidad de extensión en el navegador)
xdebug.start_with_request = yes

; host.docker.internal apunta al host desde dentro de Docker (Windows/Mac)
xdebug.client_host = host.docker.internal

; Puerto estándar de Xdebug (el que escucha VS Code)
xdebug.client_port = 9003

; Logs de Xdebug (descomentar para diagnosticar problemas de conexión)
; xdebug.log = /tmp/xdebug.log

; Idekey para identificar la sesión
xdebug.idekey = VSCODE
